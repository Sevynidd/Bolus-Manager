# This workflow performs a static analysis of your Kotlin source code using
# Detekt, run through the project's own Gradle configuration
# (config/detekt/detekt.yml + config/detekt/baseline.xml).
#
# Scans are triggered:
# 1. On every push to default and protected branches
# 2. On every Pull Request targeting the default branch
# 3. On a weekly schedule
# 4. Manually, on demand, via the "workflow_dispatch" event
name: Scan with Detekt

on:
  # Triggers the workflow on push or pull request events but only for default and protected branches
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
     - cron: '33 8 * * 5'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "scan"
  scan:
    name: Scan
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # Runs Detekt using the project's own config and baseline (see app/build.gradle.kts)
    # continue-on-error is intentional: Detekt fails the Gradle build when it finds
    # issues, but the report is still written and we want to upload it regardless.
    - name: Run Detekt
      id: run_detekt
      continue-on-error: true
      run: bash gradlew detekt --stacktrace

    # Surfaces what actually happened even when the step above is collapsed in the UI,
    # so a real (pre-analysis) failure is never silently swallowed by continue-on-error.
    - name: Check Detekt report was produced
      if: always()
      run: |
        echo "Run Detekt step outcome: ${{ steps.run_detekt.outcome }}"
        if [ -f "app/build/reports/detekt/detekt.sarif" ]; then
          echo "detekt.sarif found:"
          ls -la app/build/reports/detekt/
        else
          echo "::error::detekt.sarif was not produced. The Detekt task likely failed before running analysis (e.g. dependency/type resolution error) rather than failing on lint findings. Check the 'Run Detekt' step log above for the real error."
          find app/build/reports -type f 2>/dev/null || echo "No reports directory at all."
          exit 1
        fi

    # Modifies the SARIF output produced by Detekt so that absolute URIs are relative
    # This is so we can easily map results onto their source files
    # This can be removed once relative URI support lands in Detekt: https://git.io/JLBbA
    - name: Make artifact location URIs relative
      continue-on-error: true
      run: |
        echo "$(
          jq \
            --arg github_workspace ${{ github.workspace }} \
            '. | ( .runs[].results[].locations[].physicalLocation.artifactLocation.uri |= if test($github_workspace) then .[($github_workspace | length | . + 1):] else . end )' \
            ${{ github.workspace }}/app/build/reports/detekt/detekt.sarif
        )" > ${{ github.workspace }}/app/build/reports/detekt/detekt.sarif

    # Uploads results to GitHub repository using the upload-sarif action
    - uses: github/codeql-action/upload-sarif@v4
      with:
        # Path to SARIF file relative to the root of the repository
        sarif_file: app/build/reports/detekt/detekt.sarif
        checkout_path: ${{ github.workspace }}
