# Detekt config for Bolus Manager.
# Builds upon detekt's default rule set (buildUponDefaultConfig = true in
# app/build.gradle.kts) — only deviations from the defaults are listed here.
# See AGENTS.md "Static Analysis (Detekt)" for the thresholds this enforces.

build:
  maxIssues: 0

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by Compose convention, not a
    # naming violation.
    ignoreAnnotated: ['Composable']

style:
  UnusedPrivateMember:
    # @Preview composables are entry points for Android Studio's preview
    # renderer, not dead code, even though nothing in the module calls them.
    ignoreAnnotated: ['Preview']
